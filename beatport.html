<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MO7S — Beatport</title>
  <style>
    :root {
      --bg: #080808;
      --ink: #f2f2f2;
      --muted: #a8a8a8;
      --tile: #101010;
      --shadow: rgba(0,0,0,0.55);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      color: var(--ink);
      background: var(--bg);
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .beatport-tracks {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
      margin: 20px 0;
    }

    .track-card {
      border-radius: 12px;
      overflow: hidden;
      background: var(--tile);
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 10px 28px var(--shadow);
    }

    .track-embed {
      width: 100%;
      height: 160px;
      border: none;
      background: #000;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>MO7S on Beatport</h1>
    <div class="beatport-tracks">
      <!-- Artist embed - Beatport updates it automatically -->
      <div class="track-card">
        <iframe 
          class="track-embed"
          src="https://embed.beatport.com/?id=56543&type=artist"
          frameborder="0"
          scrolling="no"
          allowfullscreen
        ></iframe>
      </div>
    </div>
  </div>
</body>
</html>
